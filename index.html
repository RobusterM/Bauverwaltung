```html
<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bauverwaltung</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #2481cc;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #authResult,
    #registrationResult {
      margin-top: 15px;
    }

  </style>

</head>


<body>

  <h1>🏠 Bauverwaltung</h1>


  <!-- ========================================= -->
  <!-- BENUTZERKARTE -->
  <!-- ========================================= -->

  <div
    id="userCard"
    class="card"
    style="display:none;"
  >

    <h2>👤 Benutzer</h2>

    <p>
      <strong>Name:</strong>
      <span id="name"></span>
    </p>

    <p>
      <strong>Username:</strong>
      <span id="username"></span>
    </p>

    <p>
      <strong>Telegram ID:</strong>
      <span id="id"></span>
    </p>

  </div>


  <!-- ========================================= -->
  <!-- REGISTRIERUNG -->
  <!-- ========================================= -->

  <div
    id="registrationCard"
    class="card"
    style="display:none;"
  >

    <h2>🔐 Registrierung</h2>

    <p>
      Du wurdest zur Bauverwaltung eingeladen.
    </p>

    <p>
      Bitte gib das Zugangspasswort ein:
    </p>

    <input
      id="registrationPassword"
      type="password"
      placeholder="Zugangspasswort"
      autocomplete="off"
    >

    <button
      id="registrationButton"
      onclick="registerUser()"
    >
      🔐 Registrieren
    </button>

    <div id="registrationResult"></div>

  </div>


  <!-- ========================================= -->
  <!-- ANMELDUNG -->
  <!-- ========================================= -->

  <div
    id="loginCard"
    class="card"
    style="display:none;"
  >

    <h2>🔑 Anmeldung</h2>

    <p>
      Wenn du bereits registriert bist, kannst du
      dich hier anmelden.
    </p>

    <button onclick="authenticate()">
      🔐 Bei Bauverwaltung anmelden
    </button>

    <div id="authResult"></div>

  </div>


  <script>


    // =========================================
    // TELEGRAM
    // =========================================

    const tg =
      window.Telegram.WebApp;


    tg.ready();
    tg.expand();



    // =========================================
    // APPS SCRIPT
    // =========================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbytTS_UdYyX0d_I05hTW6l8-YXb3WT1g1PD4BqF-AeGqipgYQJYYRFKhVyPXQyHlPxx/exec";



    // =========================================
    // ELEMENTE
    // =========================================

    const userCard =
      document.getElementById(
        "userCard"
      );


    const registrationCard =
      document.getElementById(
        "registrationCard"
      );


    const loginCard =
      document.getElementById(
        "loginCard"
      );



    // =========================================
    // TELEGRAM PRÜFEN
    // =========================================

    if (!tg.initData) {

      document.body.innerHTML =
        '<div class="card">' +
        '<p class="error">' +
        '<strong>❌ Diese Seite muss über Telegram geöffnet werden.</strong>' +
        '</p>' +
        '</div>';

    } else {

      const user =
        tg.initDataUnsafe.user;


      if (user) {

        userCard.style.display =
          "block";


        document
          .getElementById("name")
          .textContent =
            user.first_name +
            (
              user.last_name
                ? " " + user.last_name
                : ""
            );


        document
          .getElementById("username")
          .textContent =
            user.username
              ? "@" + user.username
              : "kein Username";


        document
          .getElementById("id")
          .textContent =
            user.id;

      }


      // =======================================
      // EINLADUNGSCODE ERMITTELN
      // =======================================

      const invitationCode =
        getInvitationCode();


      if (invitationCode) {

        registrationCard.style.display =
          "block";

      } else {

        loginCard.style.display =
          "block";

      }

    }



    // =========================================
    // EINLADUNGSCODE AUS STARTAPP
    // =========================================

    function getInvitationCode() {

      try {

        const startParam =
          tg.initDataUnsafe
            .start_param;


        if (
          startParam &&
          startParam.trim() !== ""
        ) {

          return startParam.trim();

        }


        const params =
          new URLSearchParams(
            tg.initData
          );


        const startParamFromData =
          params.get(
            "start_param"
          );


        if (
          startParamFromData &&
          startParamFromData.trim() !== ""
        ) {

          return startParamFromData.trim();

        }


        return null;

      } catch (error) {

        console.error(
          "Fehler beim Lesen des Einladungscodes:",
          error
        );

        return null;

      }

    }



    // =========================================
    // REGISTRIEREN
    // =========================================

    async function registerUser() {

      const passwordInput =
        document.getElementById(
          "registrationPassword"
        );


      const button =
        document.getElementById(
          "registrationButton"
        );


      const result =
        document.getElementById(
          "registrationResult"
        );


      const password =
        passwordInput.value.trim();


      const invitationCode =
        getInvitationCode();


      if (!password) {

        result.innerHTML =
          '<span class="error">' +
          '❌ Bitte Passwort eingeben.' +
          '</span>';

        return;

      }


      if (!invitationCode) {

        result.innerHTML =
          '<span class="error">' +
          '❌ Kein gültiger Einladungscode gefunden.' +
          '</span>';

        return;

      }


      button.disabled =
        true;


      result.innerHTML =
        "⏳ Registrierung läuft...";


      try {

        const response =
          await fetch(
            APPS_SCRIPT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body:
                JSON.stringify({

                  action:
                    "registerUser",

                  initData:
                    tg.initData,

                  invitationCode:
                    invitationCode,

                  password:
                    password

                })

            }
          );


        const data =
          await response.json();


        if (data.ok) {

          result.innerHTML =
            '<span class="success">' +
            '<strong>✅ Registrierung erfolgreich!</strong>' +
            '<br><br>' +
            '👤 ' +
            data.user.first_name +
            ' ' +
            data.user.last_name +
            '<br>' +
            '🔑 Rolle: ' +
            data.user.role +
            '<br><br>' +
            'Du kannst die Bauverwaltung jetzt verwenden.' +
            '</span>';


          passwordInput.value =
            "";


        } else {

          result.innerHTML =
            '<span class="error">' +
            '❌ Registrierung fehlgeschlagen:<br>' +
            data.error +
            '</span>';


          button.disabled =
            false;

        }


      } catch (error) {

        result.innerHTML =
          '<span class="error">' +
          '❌ Verbindungsfehler:<br>' +
          error +
          '</span>';


        button.disabled =
          false;

      }

    }



    // =========================================
    // BESTEHENDE AUTHENTIFIZIERUNG
    // =========================================

    async function authenticate() {

      const result =
        document.getElementById(
          "authResult"
        );


      result.innerHTML =
        "⏳ Authentifizierung läuft...";


      try {

        const response =
          await fetch(
            APPS_SCRIPT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body:
                JSON.stringify({

                  action:
                    "authenticate",

                  initData:
                    tg.initData

                })

            }
          );


        const data =
          await response.json();


        if (data.ok) {

          result.innerHTML =
            '<span class="success">' +
            "✅ Authentifiziert<br><br>" +
            "👤 " +
            data.user.first_name +
            " " +
            data.user.last_name +
            "<br>" +
            "🔑 Rolle: " +
            data.user.role +
            "</span>";

        } else {

          result.innerHTML =
            '<span class="error">' +
            "❌ Authentifizierung fehlgeschlagen:<br>" +
            data.error +
            "</span>";

        }


      } catch (error) {

        result.innerHTML =
          '<span class="error">' +
          "❌ Verbindungsfehler:<br>" +
          error +
          "</span>";

      }

    }

  </script>

</body>

</html>
```

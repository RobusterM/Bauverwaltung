<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bauverwaltung</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .userInfo {
      background: white;
      border-radius: 12px;
      padding: 15px 20px;
      margin-top: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .info {
      color: #555;
    }

    /* =========================================
       MENÜ
       ========================================= */

    .menu {
      margin-top: 20px;
    }

    .menuButton {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      font-size: 17px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: white;
      color: #222;
      text-align: left;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .menuButton:hover {
      background: #f8f8f8;
    }

    .menuButton .icon {
      font-size: 24px;
      margin-right: 10px;
    }

    .adminButton {
      border-left: 5px solid #2481cc;
    }

    /* =========================================
       FORMULAR
       ========================================= */

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    select,
    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .primaryButton {
      background: #2481cc;
      color: white;
    }

    .secondaryButton {
      background: #777;
      color: white;
    }

    .typeButtons {
      display: flex;
      gap: 10px;
    }

    .typeButton {
      flex: 1;
      margin-top: 0;
      background: #ddd;
      color: #333;
    }

    .typeButton.active {
      background: #2481cc;
      color: white;
    }

    #authResult {
      margin-top: 15px;
    }

    #bookingResult {
      margin-top: 15px;
      line-height: 1.5;
    }

    /* =========================================
       BUCHUNGEN
       ========================================= */

    .booking {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .bookingHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .bookingCategory {
      font-weight: bold;
      font-size: 17px;
    }

    .bookingAmount {
      font-weight: bold;
      font-size: 17px;
      white-space: nowrap;
    }

    .expense {
      color: #c62828;
    }

    .income {
      color: #16803c;
    }

    .bookingDetails {
      margin-top: 8px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .bookingDescription {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #ddd;
      font-size: 14px;
    }

    .bookingActions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .bookingActions button {
      margin-top: 0;
      padding: 10px;
      font-size: 14px;
    }

    .editButton {
      background: #777;
      color: white;
    }

    .deleteButton {
      background: #c62828;
      color: white;
    }

    .emptyBookings {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    /* =========================================
       BEARBEITEN
       ========================================= */

    .editingNotice {
      background: #fff3cd;
      color: #856404;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
    }

  </style>

</head>


<body>


  <!-- =========================================
       KOPF
       ========================================= -->

  <h1>🏠 Bauverwaltung</h1>


  <div id="status">
    Telegram wird geprüft...
  </div>


  <!-- =========================================
       BENUTZER
       ========================================= -->

  <div
    id="userCard"
    class="userInfo"
    style="display:none;"
  >

    <div>

      👤
      <strong id="name"></strong>

    </div>

    <div
      style="margin-top:6px;"
    >

      🔑
      <span id="role"></span>

    </div>

  </div>


  <!-- =========================================
       ANMELDEN
       ========================================= -->

  <div
    id="loginCard"
    class="card"
    style="display:none;"
  >

    <button
      id="authButton"
      class="primaryButton"
      onclick="authenticate()"
    >

      🔐 Bei Bauverwaltung anmelden

    </button>

    <div id="authResult"></div>

  </div>


  <!-- =========================================
       HAUPTMENÜ
       ========================================= -->

  <div
    id="mainMenu"
    class="menu"
    style="display:none;"
  >


    <button
      class="menuButton"
      onclick="showPage('booking')"
    >

      <span class="icon">➕</span>

      <strong>Neue Buchung</strong>

    </button>


    <button
      class="menuButton"
      onclick="showPage('bookings')"
    >

      <span class="icon">📋</span>

      <strong>Meine Buchungen</strong>

    </button>


    <button
      class="menuButton"
      onclick="showPage('evaluation')"
    >

      <span class="icon">📊</span>

      <strong>Auswertung</strong>

    </button>


    <button
      id="adminMenuButton"
      class="menuButton adminButton"
      onclick="showPage('admin')"
      style="display:none;"
    >

      <span class="icon">⚙️</span>

      <strong>Verwaltung</strong>

    </button>


  </div>


  <!-- =========================================
       NEUE BUCHUNG
       ========================================= -->

  <div
    id="bookingPage"
    class="card"
    style="display:none;"
  >

    <h2 id="bookingFormTitle">
      ➕ Neue Buchung
    </h2>


    <div
      id="editingNotice"
      class="editingNotice"
      style="display:none;"
    >

      ✏️ Du bearbeitest gerade eine bestehende Buchung.

    </div>


    <label for="project">
      Projekt
    </label>


    <select id="project">

      <option value="">
        Projekte werden geladen...
      </option>

    </select>


    <label>
      Typ
    </label>


    <div class="typeButtons">


      <button
        type="button"
        id="expenseButton"
        class="typeButton active"
        onclick="setBookingType('Ausgabe')"
      >

        💸 Ausgabe

      </button>


      <button
        type="button"
        id="incomeButton"
        class="typeButton"
        onclick="setBookingType('Einnahme')"
      >

        💰 Einnahme

      </button>


    </div>


    <label for="category">
      Kategorie
    </label>


    <select id="category">

      <option value="">
        Kategorien werden geladen...
      </option>

    </select>


    <label for="amount">
      Betrag (€)
    </label>


    <input
      id="amount"
      type="number"
      inputmode="decimal"
      step="0.01"
      min="0"
      placeholder="0,00"
    >


    <label for="description">
      Beschreibung (optional)
    </label>


    <textarea
      id="description"
      placeholder="z. B. Baumaterial, Rechnung Nr. 123..."
    ></textarea>


    <button
      id="saveBookingButton"
      class="primaryButton"
      onclick="saveBooking()"
    >

      💾 Buchung speichern

    </button>


    <button
      id="cancelEditButton"
      class="secondaryButton"
      onclick="cancelEdit()"
      style="display:none;"
    >

      ❌ Bearbeitung abbrechen

    </button>


    <button
      class="secondaryButton"
      onclick="showPage('menu')"
    >

      ↩️ Zurück zum Menü

    </button>


    <div id="bookingResult"></div>

  </div>


  <!-- =========================================
       MEINE BUCHUNGEN
       ========================================= -->

  <div
    id="bookingsPage"
    class="card"
    style="display:none;"
  >

    <h2>📋 Meine Buchungen</h2>


    <div id="bookingsList">

      <div class="info">
        ⏳ Buchungen werden geladen...
      </div>

    </div>


    <button
      class="secondaryButton"
      onclick="loadBookings()"
    >

      🔄 Aktualisieren

    </button>


    <button
      class="secondaryButton"
      onclick="showPage('menu')"
    >

      ↩️ Zurück zum Menü

    </button>

  </div>


  <!-- =========================================
       AUSWERTUNG
       ========================================= -->

  <div
    id="evaluationPage"
    class="card"
    style="display:none;"
  >

    <h2>📊 Auswertung</h2>


    <p class="info">

      Die Auswertung wird im nächsten Schritt
      aufgebaut.

    </p>


    <button
      class="secondaryButton"
      onclick="showPage('menu')"
    >

      ↩️ Zurück zum Menü

    </button>

  </div>


  <!-- =========================================
       VERWALTUNG
       ========================================= -->

  <div
    id="adminPage"
    class="card"
    style="display:none;"
  >

    <h2>⚙️ Verwaltung</h2>


    <p class="info">

      Dieser Bereich ist nur für Administratoren
      verfügbar.

    </p>


    <button
      class="secondaryButton"
      onclick="showPage('menu')"
    >

      ↩️ Zurück zum Menü

    </button>

  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>


    // =========================================
    // TELEGRAM
    // =========================================

    const tg =
      window.Telegram.WebApp;


    tg.ready();

    tg.expand();


    // =========================================
    // APPS SCRIPT
    // =========================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbytTS_UdYyX0d_I05hTW6l8-YXb3WT1g1PD4BqF-AeGqipgYQJYYRFKhVyPXQyHlPxx/exec";


    // =========================================
    // VARIABLEN
    // =========================================

    let projects = [];

    let categories = [];

    let bookingType = "Ausgabe";

    let editingBookingId = null;

    let currentUser = null;


    // =========================================
    // TELEGRAM PRÜFEN
    // =========================================

    const status =
      document.getElementById("status");


    if (!tg.initData) {


      status.innerHTML =

        '<p class="error">' +

        '<strong>❌ Keine Telegram-Daten</strong>' +

        '</p>' +

        '<p>' +

        'Diese Seite muss über Telegram geöffnet werden.' +

        '</p>';


    } else {


      status.innerHTML =

        '<p class="success">' +

        '<strong>✅ Telegram erkannt</strong>' +

        '</p>';


      const user =
        tg.initDataUnsafe.user;


      if (user) {


        document
          .getElementById("userCard")
          .style.display = "block";


        document
          .getElementById("name")
          .textContent =

          user.first_name +

          (
            user.last_name
              ? " " + user.last_name
              : ""
          );


        document
          .getElementById("loginCard")
          .style.display = "block";

      }

    }


    // =========================================
    // AUTHENTIFIZIERUNG
    // =========================================

    async function authenticate() {


      const result =
        document.getElementById(
          "authResult"
        );


      const button =
        document.getElementById(
          "authButton"
        );


      button.disabled = true;


      result.innerHTML =
        "⏳ Authentifizierung läuft...";


      try {


        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:

                JSON.stringify({

                  action:
                    "authenticate",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            data.error
          );

        }


        currentUser =
          data.user;


        document
          .getElementById("role")
          .textContent =
            currentUser.role;


        document
          .getElementById("loginCard")
          .style.display =
            "none";


        document
          .getElementById("mainMenu")
          .style.display =
            "block";


        // Admin-Menü

        if (
          String(
            currentUser.role
          ).toLowerCase() ===
          "admin"
        ) {

          document
            .getElementById(
              "adminMenuButton"
            )
            .style.display =
              "block";

        }


        await loadProjects();

        await loadCategories();

        await loadBookings();


        showPage("menu");


      } catch (error) {


        result.innerHTML =

          '<span class="error">' +

          "❌ Authentifizierung fehlgeschlagen:<br>" +

          error +

          "</span>";


        button.disabled = false;

      }

    }


    // =========================================
    // SEITENNAVIGATION
    // =========================================

    function showPage(page) {


      document
        .getElementById("bookingPage")
        .style.display =
          "none";


      document
        .getElementById("bookingsPage")
        .style.display =
          "none";


      document
        .getElementById("evaluationPage")
        .style.display =
          "none";


      document
        .getElementById("adminPage")
        .style.display =
          "none";


      if (page === "menu") {

        return;

      }


      if (page === "booking") {

        document
          .getElementById("bookingPage")
          .style.display =
            "block";

      }


      if (page === "bookings") {

        document
          .getElementById("bookingsPage")
          .style.display =
            "block";


        loadBookings();

      }


      if (page === "evaluation") {

        document
          .getElementById("evaluationPage")
          .style.display =
            "block";

      }


      if (page === "admin") {


        if (
          !currentUser ||
          String(
            currentUser.role
          ).toLowerCase() !==
          "admin"
        ) {

          alert(
            "❌ Keine Berechtigung."
          );

          return;

        }


        document
          .getElementById("adminPage")
          .style.display =
            "block";

      }

    }


    // =========================================
    // PROJEKTE LADEN
    // =========================================

    async function loadProjects() {


      try {


        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:

                JSON.stringify({

                  action:
                    "getProjects",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            data.error
          );

        }


        projects =
          data.projects || [];


        const select =
          document.getElementById(
            "project"
          );


        select.innerHTML =

          '<option value="">' +

          'Projekt auswählen...' +

          '</option>';


        projects.forEach(

          project => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              project.id;


            option.textContent =
              project.name;


            select.appendChild(
              option
            );

          }

        );


      } catch (error) {


        console.error(
          "Projektfehler:",
          error
        );

      }

    }


    // =========================================
    // KATEGORIEN LADEN
    // =========================================

    async function loadCategories() {


      try {


        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:

                JSON.stringify({

                  action:
                    "getCategories",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            data.error
          );

        }


        categories =
          data.categories || [];


        updateCategoryList();


      } catch (error) {


        console.error(
          "Kategoriefehler:",
          error
        );

      }

    }


    // =========================================
    // BUCHUNGSTYP
    // =========================================

    function setBookingType(type) {


      bookingType =
        type;


      document
        .getElementById(
          "expenseButton"
        )
        .classList
        .toggle(
          "active",
          type === "Ausgabe"
        );


      document
        .getElementById(
          "incomeButton"
        )
        .classList
        .toggle(
          "active",
          type === "Einnahme"
        );


      updateCategoryList();

    }


    // =========================================
    // KATEGORIEN
    // =========================================

    function updateCategoryList(
      selectedCategory = ""
    ) {


      const select =
        document.getElementById(
          "category"
        );


      select.innerHTML =

        '<option value="">' +

        'Kategorie auswählen...' +

        '</option>';


      categories

        .filter(
          category =>
            category.type ===
            bookingType
        )

        .forEach(

          category => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              category.name;


            option.textContent =
              category.name;


            if (
              category.name ===
              selectedCategory
            ) {

              option.selected =
                true;

            }


            select.appendChild(
              option
            );

          }

        );

    }


    // =========================================
    // BUCHUNG SPEICHERN
    // =========================================

    async function saveBooking() {


      const projectId =
        document
          .getElementById("project")
          .value;


      const category =
        document
          .getElementById("category")
          .value;


      const amount =
        document
          .getElementById("amount")
          .value;


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const result =
        document
          .getElementById("bookingResult");


      if (!projectId) {

        result.innerHTML =
          '<span class="error">❌ Bitte ein Projekt auswählen.</span>';

        return;

      }


      if (!category) {

        result.innerHTML =
          '<span class="error">❌ Bitte eine Kategorie auswählen.</span>';

        return;

      }


      if (
        !amount ||
        Number(amount) <= 0
      ) {

        result.innerHTML =
          '<span class="error">❌ Bitte einen gültigen Betrag eingeben.</span>';

        return;

      }


      try {


        const action =
          editingBookingId
            ? "updateBooking"
            : "createBooking";


        const booking = {

          projectId:
            projectId,

          type:
            bookingType,

          category:
            category,

          amount:
            amount,

          description:
            description

        };


        if (editingBookingId) {

          booking.id =
            editingBookingId;

        }


        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:

                JSON.stringify({

                  action:
                    action,

                  initData:
                    tg.initData,

                  booking:
                    booking

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            data.error
          );

        }


        result.innerHTML =
          '<span class="success">✅ Buchung erfolgreich gespeichert.</span>';


        cancelEdit();


        await loadBookings();


      } catch (error) {


        result.innerHTML =
          '<span class="error">❌ Fehler:<br>' +
          error.message +
          "</span>";

      }

    }


    // =========================================
    // BUCHUNGEN LADEN
    // =========================================

    async function loadBookings() {


      const list =
        document.getElementById(
          "bookingsList"
        );


      if (!list) {
        return;
      }


      list.innerHTML =
        '<div class="info">⏳ Buchungen werden geladen...</div>';


      try {


        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:

                JSON.stringify({

                  action:
                    "getBookings",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            data.error
          );

        }


        displayBookings(
          data.bookings || []
        );


      } catch (error) {


        list.innerHTML =
          '<div class="error">' +
          "❌ Buchungen konnten nicht geladen werden.<br><br>" +
          error.message +
          "</div>";

      }

    }


    // =========================================
    // BUCHUNGEN DARSTELLEN
    // =========================================

    function displayBookings(
      bookings
    ) {


      const list =
        document.getElementById(
          "bookingsList"
        );


      if (!bookings.length) {

        list.innerHTML =
          '<div class="emptyBookings">' +
          "Noch keine Buchungen vorhanden." +
          "</div>";

        return;

      }


      list.innerHTML = "";


      bookings.forEach(

        booking => {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "booking";


          const amount =
            Number(
              booking.amount
            ).toLocaleString(
              "de-DE",
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }
            );


          const isIncome =
            booking.type ===
            "Einnahme";


          item.innerHTML =

            '<div class="bookingHeader">' +

              '<div class="bookingCategory">' +

                (
                  isIncome
                    ? "💰"
                    : "💸"
                ) +

                " " +

                escapeHtml(
                  booking.category
                ) +

              "</div>" +

              '<div class="bookingAmount ' +

                (
                  isIncome
                    ? "income"
                    : "expense"
                ) +

              '">' +

                (
                  isIncome
                    ? "+"
                    : "-"
                ) +

                amount +

                " €" +

              "</div>" +

            "</div>" +


            '<div class="bookingDetails">' +

              escapeHtml(
                booking.date
              ) +

              " · " +

              escapeHtml(
                booking.time
              ) +

              "<br>" +

              "Projekt: " +

              escapeHtml(
                getProjectName(
                  booking.projectId
                )
              ) +

            "</div>" +


            (
              booking.description

                ? '<div class="bookingDescription">' +
                  escapeHtml(
                    booking.description
                  ) +
                  "</div>"

                : ""

            ) +


            '<div class="bookingActions">' +

              '<button ' +
                'class="editButton" ' +
                'onclick=\'editBooking(' +
                JSON.stringify(booking)
                  .replace(
                    /'/g,
                    "&#39;"
                  ) +
                ")\'>" +
                "✏️ Bearbeiten" +
              "</button>" +


              '<button ' +
                'class="deleteButton" ' +
                'onclick="deleteBooking(\'' +
                escapeHtml(
                  booking.id
                ) +
                "')\">" +
                "🗑️ Löschen" +
              "</button>" +

            "</div>";


          list.appendChild(
            item
          );

        }

      );

    }


    // =========================================
    // BEARBEITEN
    // =========================================

    function editBooking(
      booking
    ) {


      editingBookingId =
        booking.id;


      document
        .getElementById(
          "bookingFormTitle"
        )
        .textContent =
          "✏️ Buchung bearbeiten";


      document
        .getElementById(
          "editingNotice"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "cancelEditButton"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "saveBookingButton"
        )
        .textContent =
          "💾 Änderung speichern";


      document
        .getElementById(
          "project"
        )
        .value =
          booking.projectId;


      setBookingType(
        booking.type
      );


      updateCategoryList(
        booking.category
      );


      document
        .getElementById(
          "amount"
        )
        .value =
          booking.amount;


      document
        .getElementById(
          "description"
        )
        .value =
          booking.description || "";


      showPage("booking");

    }


    // =========================================
    // BEARBEITUNG ABBRECHEN
    // =========================================

    function cancelEdit() {


      editingBookingId =
        null;


      document
        .getElementById(
          "bookingFormTitle"
        )
        .textContent =
          "➕ Neue Buchung";


      document
        .getElementById(
          "editingNotice"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "cancelEditButton"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "saveBookingButton"
        )
        .textContent =
          "💾 Buchung speichern";


      document
        .getElementById(
          "project"
        )
        .value = "";


      document
        .getElementById(
          "amount"
        )
        .value = "";


      document
        .getElementById(
          "description"
        )
        .value = "";


      document
        .getElementById(
          "bookingResult"
        )
        .innerHTML = "";

    }


    // =========================================
    // LÖSCHEN
    // =========================================

    async function deleteBooking(
      bookingId
    ) {


      if (
        !confirm(
          "Möchtest du diese Buchung wirklich löschen?"
        )
      ) {

        return;

      }


      try {


        const response =
          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain"
              },

              body:

                JSON.stringify({

                  action:
                    "deleteBooking",

                  initData:
                    tg.initData,

                  bookingId:
                    bookingId

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            data.error
          );

        }


        await loadBookings();


      } catch (error) {


        alert(
          "❌ Fehler beim Löschen:\n\n" +
          error.message
        );

      }

    }


    // =========================================
    // PROJEKTNAME
    // =========================================

    function getProjectName(
      projectId
    ) {


      const project =
        projects.find(

          p =>
            String(p.id) ===
            String(projectId)

        );


      return project
        ? project.name
        : projectId;

    }


    // =========================================
    // HTML ESCAPING
    // =========================================

    function escapeHtml(
      value
    ) {


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


  </script>

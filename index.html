<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bauverwaltung</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      padding: 20px;

      background: #f4f4f4;

    }


    h1 {

      margin-top: 0;

    }


    h2 {

      margin-top: 0;

    }


    .card {

      background: white;

      border-radius: 12px;

      padding: 20px;

      margin-top: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.1);

    }


    .success {

      color: #16803c;

    }


    .error {

      color: #c62828;

    }


    .info {

      color: #555;

    }


    label {

      display: block;

      font-weight: bold;

      margin-top: 15px;

      margin-bottom: 6px;

    }


    select,
    input,
    textarea {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      font-size: 16px;

      border: 1px solid #ccc;

      border-radius: 8px;

      background: white;

    }


    textarea {

      resize: vertical;

      min-height: 80px;

    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 20px;

      font-size: 16px;

      border: none;

      border-radius: 10px;

      cursor: pointer;

      background: #2481cc;

      color: white;

    }


    button:disabled {

      background: #aaa;

      cursor: default;

    }


    .typeButtons {

      display: flex;

      gap: 10px;

    }


    .typeButton {

      flex: 1;

      margin-top: 0;

      background: #ddd;

      color: #333;

    }


    .typeButton.active {

      background: #2481cc;

      color: white;

    }


    #authResult {

      margin-top: 15px;

    }


    #bookingResult {

      margin-top: 15px;

      line-height: 1.5;

    }


    #bookingCard {

      display: none;

    }


    #myBookingsCard {

      display: none;

    }


    .booking {

      border: 1px solid #ddd;

      border-radius: 10px;

      padding: 15px;

      margin-top: 12px;

      background: #fafafa;

    }


    .bookingHeader {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

    }


    .bookingCategory {

      font-weight: bold;

      font-size: 17px;

    }


    .bookingAmount {

      font-weight: bold;

      font-size: 17px;

      white-space: nowrap;

    }


    .expense {

      color: #c62828;

    }


    .income {

      color: #16803c;

    }


    .bookingDetails {

      margin-top: 8px;

      color: #555;

      font-size: 14px;

      line-height: 1.5;

    }


    .bookingDescription {

      margin-top: 8px;

      padding-top: 8px;

      border-top: 1px solid #ddd;

      font-size: 14px;

    }


    .emptyBookings {

      text-align: center;

      color: #777;

      padding: 20px 0;

    }


    .reloadButton {

      background: #777;

      margin-top: 15px;

    }

  </style>

</head>


<body>


  <h1>🏠 Bauverwaltung</h1>


  <!-- ==================================================
       TELEGRAM STATUS
       ================================================== -->

  <div id="status">

    Telegram wird geprüft...

  </div>


  <!-- ==================================================
       BENUTZER
       ================================================== -->

  <div
    id="userCard"
    class="card"
    style="display:none;"
  >

    <h2>👤 Benutzer</h2>


    <p>

      <strong>Name:</strong>

      <span id="name"></span>

    </p>


    <p>

      <strong>Username:</strong>

      <span id="username"></span>

    </p>


    <p>

      <strong>Telegram ID:</strong>

      <span id="id"></span>

    </p>


    <button
      id="authButton"
      onclick="authenticate()"
    >

      🔐 Bei Bauverwaltung anmelden

    </button>


    <div id="authResult"></div>

  </div>


  <!-- ==================================================
       NEUE BUCHUNG
       ================================================== -->

  <div
    id="bookingCard"
    class="card"
  >

    <h2>➕ Neue Buchung</h2>


    <label for="project">

      Projekt

    </label>


    <select id="project">

      <option value="">

        Projekte werden geladen...

      </option>

    </select>


    <label>

      Typ

    </label>


    <div class="typeButtons">


      <button
        type="button"
        id="expenseButton"
        class="typeButton active"
        onclick="setBookingType('Ausgabe')"
      >

        💸 Ausgabe

      </button>


      <button
        type="button"
        id="incomeButton"
        class="typeButton"
        onclick="setBookingType('Einnahme')"
      >

        💰 Einnahme

      </button>


    </div>


    <label for="category">

      Kategorie

    </label>


    <select id="category">

      <option value="">

        Kategorien werden geladen...

      </option>

    </select>


    <label for="amount">

      Betrag (€)

    </label>


    <input
      id="amount"
      type="number"
      inputmode="decimal"
      step="0.01"
      min="0"
      placeholder="0,00"
    >


    <label for="description">

      Beschreibung (optional)

    </label>


    <textarea
      id="description"
      placeholder="z. B. Baumaterial, Rechnung Nr. 123..."
    ></textarea>


    <button
      id="saveBookingButton"
      onclick="saveBooking()"
    >

      💾 Buchung speichern

    </button>


    <div id="bookingResult"></div>

  </div>


  <!-- ==================================================
       MEINE BUCHUNGEN
       ================================================== -->

  <div
    id="myBookingsCard"
    class="card"
  >

    <h2>📋 Meine Buchungen</h2>


    <div id="bookingsList">

      <div class="info">

        ⏳ Buchungen werden geladen...

      </div>

    </div>


    <button
      class="reloadButton"
      onclick="loadBookings()"
    >

      🔄 Aktualisieren

    </button>

  </div>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script>


    // ==================================================
    // TELEGRAM
    // ==================================================

    const tg =
      window.Telegram.WebApp;


    tg.ready();

    tg.expand();


    // ==================================================
    // APPS SCRIPT URL
    // ==================================================

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbytTS_UdYyX0d_I05hTW6l8-YXb3WT1g1PD4BqF-AeGqipgYQJYYRFKhVyPXQyHlPxx/exec";


    // ==================================================
    // VARIABLEN
    // ==================================================

    let projects = [];

    let categories = [];

    let bookingType = "Ausgabe";


    // ==================================================
    // TELEGRAM PRÜFEN
    // ==================================================

    const status =
      document.getElementById("status");


    if (!tg.initData) {


      status.innerHTML =

        '<p class="error">' +

        '<strong>❌ Keine Telegram-Daten</strong>' +

        '</p>' +

        '<p>' +

        'Diese Seite muss über Telegram geöffnet werden.' +

        '</p>';


    } else {


      status.innerHTML =

        '<p class="success">' +

        '<strong>✅ Telegram erkannt</strong>' +

        '</p>';


      const user =
        tg.initDataUnsafe.user;


      if (user) {


        document
          .getElementById("userCard")
          .style.display = "block";


        document
          .getElementById("name")
          .textContent =

          user.first_name +

          (
            user.last_name
              ? " " + user.last_name
              : ""
          );


        document
          .getElementById("username")
          .textContent =

          user.username

            ? "@" + user.username

            : "kein Username";


        document
          .getElementById("id")
          .textContent =

          user.id;

      }

    }


    // ==================================================
    // AUTHENTIFIZIERUNG
    // ==================================================

    async function authenticate() {


      const result =
        document.getElementById(
          "authResult"
        );


      const button =
        document.getElementById(
          "authButton"
        );


      button.disabled = true;


      result.innerHTML =

        '<span class="info">' +

        '⏳ Authentifizierung läuft...' +

        '</span>';


      try {


        const response =

          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain"

              },


              body:

                JSON.stringify({

                  action:
                    "authenticate",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (data.ok) {


          result.innerHTML =

            '<span class="success">' +

            "✅ Authentifiziert<br><br>" +

            "👤 " +

            data.user.first_name +

            " " +

            data.user.last_name +

            "<br>" +

            "🔑 Rolle: " +

            data.user.role +

            "</span>";


          document
            .getElementById("bookingCard")
            .style.display = "block";


          document
            .getElementById("myBookingsCard")
            .style.display = "block";


          await loadProjects();

          await loadCategories();

          await loadBookings();


        } else {


          result.innerHTML =

            '<span class="error">' +

            "❌ Authentifizierung fehlgeschlagen:<br>" +

            data.error +

            "</span>";


          button.disabled = false;

        }


      } catch (error) {


        result.innerHTML =

          '<span class="error">' +

          "❌ Verbindungsfehler:<br>" +

          error +

          "</span>";


        button.disabled = false;

      }

    }


    // ==================================================
    // PROJEKTE LADEN
    // ==================================================

    async function loadProjects() {


      const select =
        document.getElementById(
          "project"
        );


      select.innerHTML =

        '<option value="">' +

        '⏳ Projekte werden geladen...' +

        '</option>';


      try {


        const response =

          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain"

              },


              body:

                JSON.stringify({

                  action:
                    "getProjects",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(

            data.error ||

            "Projekte konnten nicht geladen werden"

          );

        }


        projects =
          data.projects || [];


        select.innerHTML =

          '<option value="">' +

          'Projekt auswählen...' +

          '</option>';


        projects.forEach(

          project => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              project.id;


            option.textContent =
              project.name;


            select.appendChild(
              option
            );

          }

        );


        if (projects.length === 0) {

          select.innerHTML =

            '<option value="">' +

            'Keine aktiven Projekte vorhanden' +

            '</option>';

        }


      } catch (error) {


        select.innerHTML =

          '<option value="">' +

          '❌ Fehler beim Laden' +

          '</option>';


        console.error(

          "Projektfehler:",

          error

        );

      }

    }


    // ==================================================
    // KATEGORIEN LADEN
    // ==================================================

    async function loadCategories() {


      const select =
        document.getElementById(
          "category"
        );


      select.innerHTML =

        '<option value="">' +

        '⏳ Kategorien werden geladen...' +

        '</option>';


      try {


        const response =

          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain"

              },


              body:

                JSON.stringify({

                  action:
                    "getCategories",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(

            data.error ||

            "Kategorien konnten nicht geladen werden"

          );

        }


        categories =
          data.categories || [];


        updateCategoryList();


      } catch (error) {


        select.innerHTML =

          '<option value="">' +

          '❌ Fehler beim Laden' +

          '</option>';


        console.error(

          "Kategoriefehler:",

          error

        );

      }

    }


    // ==================================================
    // BUCHUNGSTYP
    // ==================================================

    function setBookingType(type) {


      bookingType =
        type;


      const expenseButton =
        document.getElementById(
          "expenseButton"
        );


      const incomeButton =
        document.getElementById(
          "incomeButton"
        );


      if (type === "Ausgabe") {


        expenseButton
          .classList
          .add("active");


        incomeButton
          .classList
          .remove("active");


      } else {


        incomeButton
          .classList
          .add("active");


        expenseButton
          .classList
          .remove("active");

      }


      updateCategoryList();

    }


    // ==================================================
    // KATEGORIEN FILTERN
    // ==================================================

    function updateCategoryList() {


      const select =
        document.getElementById(
          "category"
        );


      select.innerHTML =

        '<option value="">' +

        'Kategorie auswählen...' +

        '</option>';


      const filteredCategories =

        categories.filter(

          category =>

            category.type === bookingType

        );


      filteredCategories.forEach(

        category => {


          const option =

            document.createElement(
              "option"
            );


          option.value =
            category.name;


          option.textContent =
            category.name;


          select.appendChild(
            option
          );

        }

      );


      if (
        filteredCategories.length === 0
      ) {


        select.innerHTML =

          '<option value="">' +

          'Keine Kategorien vorhanden' +

          '</option>';

      }

    }


    // ==================================================
    // BUCHUNG SPEICHERN
    // ==================================================

    async function saveBooking() {


      const projectId =

        document.getElementById(
          "project"
        ).value;


      const category =

        document.getElementById(
          "category"
        ).value;


      const amount =

        document.getElementById(
          "amount"
        ).value;


      const description =

        document.getElementById(
          "description"
        ).value.trim();


      const button =

        document.getElementById(
          "saveBookingButton"
        );


      const result =

        document.getElementById(
          "bookingResult"
        );


      if (!projectId) {


        result.innerHTML =

          '<span class="error">' +

          "❌ Bitte ein Projekt auswählen." +

          "</span>";


        return;

      }


      if (!category) {


        result.innerHTML =

          '<span class="error">' +

          "❌ Bitte eine Kategorie auswählen." +

          "</span>";


        return;

      }


      if (
        !amount ||
        Number(amount) <= 0
      ) {


        result.innerHTML =

          '<span class="error">' +

          "❌ Bitte einen gültigen Betrag eingeben." +

          "</span>";


        return;

      }


      button.disabled = true;


      result.innerHTML =

        '<span class="info">' +

        "⏳ Buchung wird gespeichert..." +

        "</span>";


      try {


        const response =

          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain"

              },


              body:

                JSON.stringify({

                  action:
                    "createBooking",

                  initData:
                    tg.initData,

                  booking: {

                    projectId:
                      projectId,

                    type:
                      bookingType,

                    category:
                      category,

                    amount:
                      amount,

                    description:
                      description

                  }

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(

            data.error ||

            "Buchung konnte nicht gespeichert werden"

          );

        }


        result.innerHTML =

          '<span class="success">' +

          "✅ Buchung gespeichert!" +

          "<br><br>" +

          "Buchungs-ID: " +

          data.bookingId +

          "</span>";


        document
          .getElementById("amount")
          .value = "";


        document
          .getElementById("description")
          .value = "";


        document
          .getElementById("category")
          .value = "";


        // Liste aktualisieren

        await loadBookings();


      } catch (error) {


        result.innerHTML =

          '<span class="error">' +

          "❌ Fehler beim Speichern:<br>" +

          error.message +

          "</span>";

      }


      button.disabled = false;

    }


    // ==================================================
    // MEINE BUCHUNGEN LADEN
    // ==================================================

    async function loadBookings() {


      const list =
        document.getElementById(
          "bookingsList"
        );


      list.innerHTML =

        '<div class="info">' +

        "⏳ Buchungen werden geladen..." +

        "</div>";


      try {


        const response =

          await fetch(

            APPS_SCRIPT_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain"

              },


              body:

                JSON.stringify({

                  action:
                    "getBookings",

                  initData:
                    tg.initData

                })

            }

          );


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(

            data.error ||

            "Buchungen konnten nicht geladen werden"

          );

        }


        displayBookings(
          data.bookings || []
        );


      } catch (error) {


        list.innerHTML =

          '<div class="error">' +

          "❌ Buchungen konnten nicht geladen werden." +

          "<br><br>" +

          error.message +

          "</div>";


        console.error(

          "Buchungsfehler:",

          error

        );

      }

    }


    // ==================================================
    // BUCHUNGEN DARSTELLEN
    // ==================================================

    function displayBookings(bookings) {


      const list =
        document.getElementById(
          "bookingsList"
        );


      if (!bookings.length) {


        list.innerHTML =

          '<div class="emptyBookings">' +

          "Noch keine Buchungen vorhanden." +

          "</div>";


        return;

      }


      list.innerHTML = "";


      bookings.forEach(

        booking => {


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "booking";


          const amount =
            Number(
              booking.amount
            ).toLocaleString(
              "de-DE",
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              }
            );


          const amountClass =

            booking.type === "Einnahme"

              ? "income"

              : "expense";


          const symbol =

            booking.type === "Einnahme"

              ? "💰"

              : "💸";


          item.innerHTML =

            '<div class="bookingHeader">' +

              '<div class="bookingCategory">' +

                symbol +

                " " +

                escapeHtml(
                  booking.category
                ) +

              "</div>" +

              '<div class="bookingAmount ' +

              amountClass +

              '">' +

                (
                  booking.type === "Einnahme"
                    ? "+"
                    : "-"
                ) +

                amount +

                " €" +

              "</div>" +

            "</div>" +


            '<div class="bookingDetails">' +

              escapeHtml(
                booking.date
              ) +

              " · " +

              escapeHtml(
                booking.time
              ) +

              "<br>" +

              "Projekt: " +

              escapeHtml(
                getProjectName(
                  booking.projectId
                )
              ) +

            "</div>" +


            (
              booking.description

                ? '<div class="bookingDescription">' +

                  escapeHtml(
                    booking.description
                  ) +

                  "</div>"

                : ""

            );


          list.appendChild(
            item
          );

        }

      );

    }


    // ==================================================
    // PROJEKTNAME ERMITTELN
    // ==================================================

    function getProjectName(projectId) {


      const project =
        projects.find(

          p =>
            String(p.id) ===
            String(projectId)

        );


      if (project) {

        return project.name;

      }


      return projectId;

    }


    // ==================================================
    // HTML SICHER DARSTELLEN
    // ==================================================

    function escapeHtml(value) {


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


  </script>


</body>

</html>

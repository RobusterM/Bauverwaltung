<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bauverwaltung</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #authResult {
      margin-top: 15px;
    }

  </style>

</head>


<body>

  <h1>🏠 Bauverwaltung</h1>

  <div id="status">
    Telegram wird geprüft...
  </div>


  <div
    id="userCard"
    class="card"
    style="display:none;"
  >

    <h2>👤 Benutzer</h2>

    <p>
      <strong>Name:</strong>
      <span id="name"></span>
    </p>

    <p>
      <strong>Username:</strong>
      <span id="username"></span>
    </p>

    <p>
      <strong>Telegram ID:</strong>
      <span id="id"></span>
    </p>

    <button onclick="authenticate()">
      🔐 Bei Bauverwaltung anmelden
    </button>

    <div id="authResult"></div>

  </div>


  <script>


    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();



    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbytTS_UdYyX0d_I05hTW6l8-YXb3WT1g1PD4BqF-AeGqipgYQJYYRFKhVyPXQyHlPxx/exec";



    const status =
      document.getElementById("status");


    if (!tg.initData) {

      status.innerHTML =
        '<p class="error">' +
        '<strong>❌ Keine Telegram-Daten</strong>' +
        '</p>' +

        '<p>' +
        'Diese Seite muss über Telegram geöffnet werden.' +
        '</p>';

    } else {

      status.innerHTML =
        '<p class="success">' +
        '<strong>✅ Telegram erkannt</strong>' +
        '</p>';


      const user =
        tg.initDataUnsafe.user;


      if (user) {

        document
          .getElementById("userCard")
          .style.display = "block";


        document
          .getElementById("name")
          .textContent =
            user.first_name +
            (
              user.last_name
                ? " " + user.last_name
                : ""
            );


        document
          .getElementById("username")
          .textContent =
            user.username
              ? "@" + user.username
              : "kein Username";


        document
          .getElementById("id")
          .textContent =
            user.id;

      }

    }

    async function authenticate() {

      const result =
        document.getElementById("authResult");

      result.innerHTML =
        "⏳ Authentifizierung läuft...";


      try {

        const response =
          await fetch(
            APPS_SCRIPT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "text/plain"
              },

              body: JSON.stringify({
                initData: tg.initData
              })
            }
          );


        const data =
          await response.json();


        if (data.ok) {
        
          result.innerHTML =
            '<span class="success">' +
            "✅ Authentifiziert<br><br>" +
            "👤 " +
            data.user.first_name +
            " " +
            data.user.last_name +
            "<br>" +
            "🔑 Rolle: " +
            data.user.role +
            "</span>";
        
        }else {

          result.innerHTML =
            '<span class="error">' +
            "❌ Authentifizierung fehlgeschlagen:<br>" +
            data.error +
            "</span>";

        }


      } catch (error) {

        result.innerHTML =
          '<span class="error">' +
          "❌ Verbindungsfehler:<br>" +
          error +
          "</span>";

      }

    }

  </script>

</body>

</html>
